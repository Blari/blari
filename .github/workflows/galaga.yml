name: Update Galaga contribution graph

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/galaga.yml']

permissions:
  contents: write

concurrency:
  group: profile-galaga
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Galaga from contribution counts
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: Blari
          games: galaga
      - name: Save animation
        run: |
          mkdir -p assets
          cp dist/galaga-contribution-graph*.svg assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/galaga-contribution-graph*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Galaga contribution animation'
          git pull --rebase origin master
          git push origin HEAD:master
